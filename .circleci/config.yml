version: 2.1

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

parameters:
  node-version:
    type: string
    default: "26.4.0"
    description: >-
      Node.js version for the acceptance and smoke tests to install.
  bun-version:
    type: string
    default: "1.3.14"
    description: >-
      Bun version for the acceptance tests to install.
  pnpm-version:
    type: string
    default: "11.12.0"
    description: >-
      pnpm version for the acceptance tests to install.
  yarn-version:
    type: string
    default: "1.22.22"
    description: >-
      Yarn version for the acceptance tests to install.
  yarn-berry-version:
    type: string
    default: "4.18.1"
    description: >-
      Yarn 2+ version for the Yarn 2+ acceptance test to install alongside the
      Yarn 1 the rest of the suite uses.

executors:
  go:
    docker:
      - image: cimg/go:1.26
  # For the smoke jobs. cimg/base has no Go and no Node.js, so it proves
  # setup-node installs from nothing; the arm64, macOS and Windows images come
  # with a Node.js of their own, so they also cover getting ahead of one.
  base:
    docker:
      - image: cimg/base:stable
  arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
  macos:
    macos:
      xcode: "16.4.0"
  windows:
    machine:
      image: windows-server-2022-gui:current
      shell: bash.exe -eo pipefail
    resource_class: windows.medium

commands:
  smoke:
    description: >-
      Let setup-node pick where node goes on this executor's real PATH, then
      resolve node, npm, npx and what npm install -g installed by name in
      processes that sourced nothing.

      Everything runs from the workspace, so the executor needs no Go, no
      modules and no checkout: the suite is a cross-compiled test binary, and
      test2json and gotestsum turn its output into the JUnit CircleCI collects.
    parameters:
      platform:
        type: string
        description: The os/arch whose artifacts to run, e.g. linux/amd64.
      ext:
        type: string
        default: ""
        description: Executable suffix for the platform.
    steps:
      - run:
          name: Install Node.js onto PATH and resolve it afterwards
          command: |
            mkdir -p test-results
            # standard-verbose keeps the suite's own output in the log: which
            # directory setup-node chose is the thing worth reading even when
            # the check passes.
            ./dist/tools/<< parameters.platform >>/gotestsum<< parameters.ext >> \
              --junitfile test-results/smoke.xml \
              --format standard-verbose \
              --raw-command -- \
              ./dist/tools/<< parameters.platform >>/test2json<< parameters.ext >> \
                -p acceptance \
                ./dist/acceptance/<< parameters.platform >>/acceptance<< parameters.ext >> \
                -test.v=test2json -test.run TestAcceptance_InstallsOntoTheRealPath
          environment:
            SETUP_NODE_BINARY: ./dist/setup-node/<< parameters.platform >>/setup-node<< parameters.ext >>
            SETUP_NODE_ACCEPTANCE_VERSION: << pipeline.parameters.node-version >>
      - store_test_results:
          path: test-results

jobs:
  test:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-node-go-{{ checksum "go.sum" }}-
            - setup-node-go-
      - run: task lint
      # A release is the only thing that runs `task publish`, so a missing task
      # would otherwise surface at release time.
      - run: task lint-tasks
      - run: task test
      - store_test_results:
          path: test-results
      - save_cache:
          key: setup-node-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  # Cross-compiles setup-node into ./dist and persists it to the workspace, so
  # the smoke jobs exercise exactly what `publish` is about to ship.
  build:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-node-go-{{ checksum "go.sum" }}-
            - setup-node-go-
      - run: task dry-run
      # The suite as a binary, plus the tools to report it, so an executor with
      # no Go can run and record it.
      - run: task build-acceptance
      - run: task build-tools
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # Real nodejs.org downloads, real registry installs and a real task-agent
  # cache. Runs on the go executor because the suite compiles setup-node in
  # TestMain. setup-node itself installs Node.js, and the other three package
  # managers come from npm install -g, so the install matrix runs for real.
  acceptance:
    executor: go
    steps:
      - checkout
      - restore_cache:
          keys:
            - setup-node-go-{{ checksum "go.sum" }}-
            - setup-node-go-
      - run:
          name: Install Node.js and package managers
          command: |
            go run . --node-version << pipeline.parameters.node-version >>
            npm install --global \
              bun@<< pipeline.parameters.bun-version >> \
              pnpm@<< pipeline.parameters.pnpm-version >> \
              yarn@<< pipeline.parameters.yarn-version >>
      - run:
          name: Run acceptance tests
          # The real-PATH test is the smoke jobs' to run: here it would take
          # back the node and package managers the rest of the suite uses.
          command: task acceptance -- -skip '^TestAcceptance_InstallsOntoTheRealPath$'
          environment:
            # Use the job's own cache rather than the in-memory stand-in, so the
            # round-trips here exercise the real thing. The suite fails rather
            # than falling back if it can't reach it.
            TOOLKIT_CACHE_MODE: live
            SETUP_NODE_ACCEPTANCE_YARN_BERRY_VERSION: << pipeline.parameters.yarn-berry-version >>
      - store_test_results:
          path: test-results

  # Each of these runs the packaged suite against the packaged artifact, so
  # the executor needs no Go, no modules and no checkout. `task smoke-local`
  # reproduces the Linux amd64 one in a container.
  smoke-linux-amd64:
    executor: base
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/amd64

  smoke-linux-arm64:
    executor: arm64
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: linux/arm64

  smoke-macos:
    executor: macos
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: darwin/arm64

  smoke-windows:
    executor: windows
    steps:
      - attach_workspace:
          at: .
      - smoke:
          platform: windows/amd64
          ext: ".exe"

workflows:
  test-publish:
    jobs:
      - test
      - build
      - acceptance
      - smoke-linux-amd64:
          requires: [build]
      - smoke-linux-arm64:
          requires: [build]
      - smoke-macos:
          requires: [build]
      - smoke-windows:
          requires: [build]
      - toolkit/release-pr:
          name: release-pr
          executor: go
          cache-prefix: setup-node-go
          # One at a time, so two pushes can't race to rewrite release/next.
          serial-group: << pipeline.project.slug >>/release-pr
          requires: &release-requires
            - test
            - acceptance
            - smoke-linux-amd64
            - smoke-linux-arm64
            - smoke-macos
            - smoke-windows
          context: [github-release]
          filters:
            branches:
              only: main
      - toolkit/publish:
          name: publish
          executor: go
          cache-prefix: setup-node-go
          serial-group: << pipeline.project.slug >>/publish
          requires: *release-requires
          context: [functions-publisher, github-release]
          filters:
            branches:
              only: main
