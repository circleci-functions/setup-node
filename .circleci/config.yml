version: 2.1

orbs:
  node: circleci/node@7.2.1
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

parameters:
  node-version:
    type: string
    default: "26.4.0"
    description: >-
      Node.js version for the setup-node smoke test to install.
  bun-version:
    type: string
    default: "1.3.14"
    description: >-
      Bun version for the setup-node smoke test to install.
  pnpm-version:
    type: string
    default: "11.12.0"
    description: >-
      pnpm version for the setup-node smoke test to install.
  yarn-version:
    type: string
    default: "1.22.22"
    description: >-
      Yarn version for the setup-node smoke test to install.

executors:
  go:
    docker:
      - image: cimg/go:1.26
  # The smoke test execs the binary `build` just cross-compiled, so it runs
  # on a bare base image rather than a language-preinstalled one.
  base:
    docker:
      - image: cimg/base:stable

jobs:
  test:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-node-go-{{ checksum "go.sum" }}-
            - setup-node-go-
      - run: task lint
      - run: task test
      - save_cache:
          key: setup-node-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

  # Cross-compiles setup-node into ./dist and persists it to the workspace, so
  # smoke-test exercises exactly what `publish` is about to ship.
  build:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-node-go-{{ checksum "go.sum" }}-
            - setup-node-go-
      - run: task dry-run
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # Smoke test for setup-node, run against the binary `build` just
  # cross-compiled from this commit/tag (rather than a previously published
  # artifact), so it exercises exactly what `publish` is about to ship.
  #
  # Each package manager gets its own fixture dir with a lockfile.
  smoke-test:
    executor: base
    steps:
      - checkout
      - attach_workspace:
          at: .
      - node/install:
          node-version: << pipeline.parameters.node-version >>
          install-bun: true
          bun-version: << pipeline.parameters.bun-version >>
          install-pnpm: true
          pnpm-version: << pipeline.parameters.pnpm-version >>
          install-yarn: true
          yarn-version: << pipeline.parameters.yarn-version >>
      - run:
          name: Install packages with npm
          command: |
            BIN="$PWD/dist/setup-node/linux/amd64/setup-node"
            APP=$(mktemp -d)
            echo "export SETUP_NODE_NPM_APP=$APP" >> "$BASH_ENV"
            cd "$APP"
            printf '{\n  "dependencies": {\n    "is-odd": "^3.0.1"\n  }\n}\n' > package.json
            npm install
            rm -rf node_modules
            "$BIN" install --app-dir "$APP" --package-manager npm
            test -d "$APP/node_modules/is-odd"
      - run:
          name: Assert NPM_CONFIG_CACHE exported to $BASH_ENV
          command: .circleci/scripts/assert_exported.sh NPM_CONFIG_CACHE
      - run:
          name: Install packages with npm (expect cache hit)
          command: |
            BIN="$PWD/dist/setup-node/linux/amd64/setup-node"
            rm -rf "$NPM_CONFIG_CACHE" "$SETUP_NODE_NPM_APP/node_modules"
            "$BIN" install --app-dir "$SETUP_NODE_NPM_APP" --package-manager npm 2>&1 | tee /tmp/setup-node-second-run.log
            grep -q "restored .* from cache" /tmp/setup-node-second-run.log
            test -d "$SETUP_NODE_NPM_APP/node_modules/is-odd"
      - run:
          name: Install packages with yarn
          command: |
            BIN="$PWD/dist/setup-node/linux/amd64/setup-node"
            APP=$(mktemp -d)
            cd "$APP"
            printf '{\n  "dependencies": {\n    "is-odd": "^3.0.1"\n  }\n}\n' > package.json
            yarn install
            rm -rf node_modules
            "$BIN" install --app-dir "$APP" --package-manager yarn
            test -d "$APP/node_modules/is-odd"
      - run:
          name: Assert YARN_CACHE_FOLDER exported to $BASH_ENV
          command: .circleci/scripts/assert_exported.sh YARN_CACHE_FOLDER
      - run:
          name: Install packages with pnpm
          command: |
            BIN="$PWD/dist/setup-node/linux/amd64/setup-node"
            APP=$(mktemp -d)
            cd "$APP"
            printf '{\n  "dependencies": {\n    "is-odd": "^3.0.1"\n  }\n}\n' > package.json
            pnpm install
            rm -rf node_modules
            "$BIN" install --app-dir "$APP" --package-manager pnpm
            test -d "$APP/node_modules/is-odd"
      - run:
          name: Assert PNPM_STORE_PATH exported to $BASH_ENV
          command: .circleci/scripts/assert_exported.sh PNPM_STORE_PATH
      - run:
          name: Install packages with bun
          command: |
            BIN="$PWD/dist/setup-node/linux/amd64/setup-node"
            APP=$(mktemp -d)
            cd "$APP"
            printf '{\n  "dependencies": {\n    "is-odd": "^3.0.1"\n  }\n}\n' > package.json
            bun install
            rm -rf node_modules
            "$BIN" install --app-dir "$APP" --package-manager bun
            test -d "$APP/node_modules/is-odd"
      - run:
          name: Assert BUN_INSTALL_CACHE_DIR exported to $BASH_ENV
          command: .circleci/scripts/assert_exported.sh BUN_INSTALL_CACHE_DIR

  publish:
    executor: go
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - setup-node-go-{{ checksum "go.sum" }}-
            - setup-node-go-
      - toolkit/setup-aws-oidc:
          role_arn: $FUNCTIONS_PUBLISHER_ROLE_ARN
      - run:
          name: Extract version from tag
          command: |
            VERSION="${CIRCLE_TAG}-$(git rev-parse --short HEAD)"
            echo "export VERSION=$VERSION" >> "$BASH_ENV"
      - run:
          name: Build and publish
          command: task publish VERSION="$VERSION"

workflows:
  test-publish:
    jobs:
      - test:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - build:
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - smoke-test:
          requires: [build]
          context: [github-readonly]
          filters:
            tags:
              only: /.*/
      - publish:
          requires: [test, smoke-test]
          context: [functions-publisher, github-readonly]
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
